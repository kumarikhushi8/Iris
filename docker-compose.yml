version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iris_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris_dev_password
      POSTGRES_DB: iris
    ports:
      - "5432:5432"
    volumes:
      - iris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: iris_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - iris_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iris_postgres_data:
  iris_redis_data:
